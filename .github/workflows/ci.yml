name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: python -m unittest discover -s tools -p test_release_gate.py
      - name: Test (race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -trimpath -o dist/pasla ./cmd/pasla
      - name: Build (Windows GUI)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/pasla.exe ./cmd/pasla

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz the path sanitiser
        run: go test -run=XXX -fuzz=FuzzSanitizeRelPath -fuzztime=60s ./internal/node
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
