name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Check Go formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Test (race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -trimpath -o dist/pasla ./cmd/pasla
      - name: Build (Windows GUI)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/pasla.exe ./cmd/pasla

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Fuzz the path sanitiser
        run: go test -run=XXX -fuzz=FuzzSanitizeRelPath -fuzztime=60s ./internal/node
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
