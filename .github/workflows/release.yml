name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag (exact tested main source; no existing assets replaced)
        required: true
        type: string
  push:
    tags: ["v*"]

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
permissions:
  contents: read
  actions: read

jobs:
  source-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tag
        run: python -c "import os,re; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)?', os.environ['RELEASE_TAG'])"
      - name: Require green CI for this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/require_green_ci.py
  build:
    needs: source-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...
      - run: make release VERSION="$RELEASE_TAG"
      - name: Extract release notes from the English changelog
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          version="${version%%-*}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/pasla-*
            dist/SHA256SUMS.txt
            dist/release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-bundle
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          body_path: dist/release-notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/pasla-*
            dist/SHA256SUMS.txt
      - name: Publish the fully uploaded draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit --draft=false -- "$RELEASE_TAG"
